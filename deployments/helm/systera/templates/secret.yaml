{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "systera.secretName" . }}
  labels:
    {{- include "systera.labels" . | nindent 4 }}
type: Opaque
stringData:
  SYSTERA_POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  SYSTERA_MODEL_API_KEY: {{ .Values.secrets.modelApiKey | quote }}
  SYSTERA_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  SYSTERA_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
