nameOverride: ""
fullnameOverride: ""

image:
  repository: systera/control-plane
  tag: "2.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Non-secret environment configuration mounted via ConfigMap.
config:
  env: production
  logLevel: info
  autoMigrate: false
  shutdownTimeout: 15s
  ssePollInterval: 2s
  sseHeartbeatInterval: 15s

  auth:
    jwksUrl: ""
    issuer: systera
    audience: systera-control-plane

  postgres:
    host: postgres
    port: 5432
    db: systera
    user: systera
    sslMode: require

  nats:
    url: nats://nats:4222
    stream: SYSTERA_EVENTS
    subjectPrefix: systera.events

  redis:
    addr: redis:6379

  s3:
    endpoint: https://s3.us-east-1.amazonaws.com
    region: us-east-1
    bucket: systera-artifacts

  model:
    provider: groq
    baseUrl: https://api.groq.com/openai/v1
    defaultModel: llama-3.3-70b-versatile
    pricingJson: '{"llama-3.3-70b-versatile":{"input_per_mtok":0,"output_per_mtok":0}}'
    timeout: 2m

# Secret management: set existingSecret for production (e.g., External Secrets / Sealed Secrets).
secrets:
  existingSecret: ""
  postgresPassword: ""
  modelApiKey: ""
  s3AccessKey: ""
  s3SecretKey: ""

# Control Plane API (cmd/api)
api:
  replicaCount: 2
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

# Durable DAG Scheduler & Outbox Relay (cmd/scheduler)
scheduler:
  replicaCount: 1
  probePort: 8081
  relayInterval: 500ms
  relayBatchSize: 100
  reclaimInterval: 5s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Specialist Agent Workers (cmd/worker-agent)
workerAgent:
  replicaCount: 2
  probePort: 8082
  agentTypes: "requirements_analyst,hld_architect,data_modeller,api_architect,security_architect,independent_reviewer,artifact_revalidator"
  leaseTTL: 60s
  pollInterval: 1s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

# Pre-install / pre-upgrade schema migration hook Job (cmd/migrate)
migrations:
  enabled: true
  command: ["/usr/local/bin/systera-migrate"]
  args: ["up"]

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: api.systera.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
