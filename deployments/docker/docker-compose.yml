services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: systera-postgres
    environment:
      POSTGRES_DB: ${SYSTERA_POSTGRES_DB:-systera}
      POSTGRES_USER: ${SYSTERA_POSTGRES_USER:-systera}
      POSTGRES_PASSWORD: ${SYSTERA_POSTGRES_PASSWORD:-systera_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - systera_postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYSTERA_POSTGRES_USER:-systera} -d ${SYSTERA_POSTGRES_DB:-systera}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: systera-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - systera_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: systera-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - systera_nats_data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: systera-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SYSTERA_S3_ACCESS_KEY:-systera_minio}
      MINIO_ROOT_PASSWORD: ${SYSTERA_S3_SECRET_KEY:-systera_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - systera_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: systera-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${SYSTERA_S3_ACCESS_KEY:-systera_minio} ${SYSTERA_S3_SECRET_KEY:-systera_minio_secret};
      mc mb --ignore-existing local/${SYSTERA_S3_BUCKET:-systera-artifacts};
      exit 0;
      "

  # Control Plane API. Opt-in: `docker compose --profile api up -d`.
  # Verifies RS256 tokens with the public key from `make keys` (.secrets/auth_public.pem),
  # or set SYSTERA_AUTH_JWKS_URL to use your identity provider instead.
  api:
    profiles: ["api"]
    image: systera-control-plane:local
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.control-plane
    container_name: systera-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYSTERA_ENV: development
      SYSTERA_HTTP_ADDR: ":8080"
      SYSTERA_AUTO_MIGRATE: "true"
      SYSTERA_POSTGRES_HOST: postgres
      SYSTERA_POSTGRES_DB: ${SYSTERA_POSTGRES_DB:-systera}
      SYSTERA_POSTGRES_USER: ${SYSTERA_POSTGRES_USER:-systera}
      SYSTERA_POSTGRES_PASSWORD: ${SYSTERA_POSTGRES_PASSWORD:-systera_dev_password}
      SYSTERA_AUTH_JWKS_URL: ${SYSTERA_AUTH_JWKS_URL:-}
      SYSTERA_AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_public.pem
      SYSTERA_AUTH_ISSUER: ${SYSTERA_AUTH_ISSUER:-systera}
      SYSTERA_AUTH_AUDIENCE: ${SYSTERA_AUTH_AUDIENCE:-systera-control-plane}
    volumes:
      - ../../.secrets/auth_public.pem:/run/secrets/auth_public.pem:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Background loops: outbox relay -> JetStream, lease reclamation, budget starvation.
  scheduler:
    profiles: ["api"]
    image: systera-control-plane:local
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.control-plane
    container_name: systera-scheduler
    entrypoint: ["/usr/local/bin/systera-scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      api:
        condition: service_started   # the API applies migrations on start
    environment:
      SYSTERA_POSTGRES_HOST: postgres
      SYSTERA_POSTGRES_DB: ${SYSTERA_POSTGRES_DB:-systera}
      SYSTERA_POSTGRES_USER: ${SYSTERA_POSTGRES_USER:-systera}
      SYSTERA_POSTGRES_PASSWORD: ${SYSTERA_POSTGRES_PASSWORD:-systera_dev_password}
      SYSTERA_NATS_URL: nats://nats:4222
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/readyz >/dev/null || exit 1"]
      interval: 10s
    restart: unless-stopped

  # Specialist agent worker. Points at Ollama on the host by default.
  worker-agent:
    profiles: ["api"]
    image: systera-control-plane:local
    container_name: systera-worker-agent
    entrypoint: ["/usr/local/bin/systera-worker-agent"]
    depends_on:
      scheduler:
        condition: service_started
    environment:
      SYSTERA_POSTGRES_HOST: postgres
      SYSTERA_POSTGRES_DB: ${SYSTERA_POSTGRES_DB:-systera}
      SYSTERA_POSTGRES_USER: ${SYSTERA_POSTGRES_USER:-systera}
      SYSTERA_POSTGRES_PASSWORD: ${SYSTERA_POSTGRES_PASSWORD:-systera_dev_password}
      SYSTERA_MODEL_BASE_URL: ${SYSTERA_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      SYSTERA_MODEL_API_KEY: ${SYSTERA_MODEL_API_KEY:-}
      SYSTERA_MODEL_DEFAULT: ${SYSTERA_MODEL_DEFAULT:-llama3.2}
      SYSTERA_MODEL_PRICING: ${SYSTERA_MODEL_PRICING:-{"llama3.2":{"input_per_mtok":0,"output_per_mtok":0}}}
      SYSTERA_WORKER_AGENT_TYPES: ${SYSTERA_WORKER_AGENT_TYPES:-requirements_analyst}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/readyz >/dev/null || exit 1"]
      interval: 10s
    restart: unless-stopped

volumes:
  systera_postgres_data:
  systera_redis_data:
  systera_nats_data:
  systera_minio_data:
